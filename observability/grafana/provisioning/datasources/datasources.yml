apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://champsly-prometheus:9090
    isDefault: true
    editable: false

  # Needs Jaeger's legacy /api endpoints (Jaeger <= 2.20, see docker-compose.yml).
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://champsly-jaeger:16686
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://champsly-loki:3100
    editable: false
    jsonData:
      # Turns each pino line's trace_id into a link that opens the trace in Jaeger.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
