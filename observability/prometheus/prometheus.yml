global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # prom-client: HTTP histogram, domain event counter, tournaments gauge, Node process metrics.
  - job_name: champsly-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["champsly-backend:4001"]

  # Cluster-wide Kafka metrics, including kafka_consumergroup_lag.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["champsly-kafka-exporter:9308"]
