
x-kafka-common: &kafka-common
  image: apache/kafka:3.9.1
  mem_limit: 1g
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    # Changing this requires deleting kafka_1_data/kafka_2_data/kafka_3_data — formatted storage is bound to this ID
    CLUSTER_ID: w3qTqfGXT_aga4tCVTjyKQ
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@champsly-kafka-1:9093,2@champsly-kafka-2:9093,3@champsly-kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
    start_period: 30s
    interval: 20s
    timeout: 15s
    retries: 5

services:
  champsly-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - champsly-backend


  champsly-backend:
    build: ./backend
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgres://user:pass@champsly-db:5432/champsly
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      champsly-db:
        condition: service_started
      champsly-kafka-1:
        condition: service_healthy
      champsly-kafka-2:
        condition: service_healthy
      champsly-kafka-3:
        condition: service_healthy
      champsly-jaeger:
        condition: service_started

  # In-memory trace storage: traces are lost on restart.
  # Pinned to 2.20: 2.21 removed the legacy /api query endpoints that Grafana's Jaeger data source
  # still uses (grafana/grafana-jaeger-datasource#87). Upgrade once the plugin moves to /api/v3.
  champsly-jaeger:
    image: jaegertracing/jaeger:2.20.0
    mem_limit: 512m
    ports:
      - "16686:16686"
      - "4318:4318"

  champsly-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: champsly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  champsly-kafka-1:
    <<: *kafka-common
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://champsly-kafka-1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  champsly-kafka-2:
    <<: *kafka-common
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://champsly-kafka-2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  champsly-kafka-3:
    <<: *kafka-common
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://champsly-kafka-3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  # Consumer lag (kafka_consumergroup_lag) for Prometheus; kafkajs doesn't expose it.
  champsly-kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    mem_limit: 128m
    ports:
      - "9308:9308"
    command:
      - --kafka.server=champsly-kafka-1:9092
      - --kafka.server=champsly-kafka-2:9092
      - --kafka.server=champsly-kafka-3:9092
      - --kafka.version=3.9.0
    depends_on:
      champsly-kafka-1:
        condition: service_healthy
      champsly-kafka-2:
        condition: service_healthy
      champsly-kafka-3:
        condition: service_healthy

  champsly-prometheus:
    image: prom/prometheus:v3.15.1
    mem_limit: 512m
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Data sources and dashboards are provisioned from files; UI edits to them are not saved.
  champsly-grafana:
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tournaments.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - champsly-prometheus
      - champsly-jaeger
      - champsly-loki

  # Queried through Grafana only, so the port isn't published.
  champsly-loki:
    image: grafana/loki:3.7.9
    mem_limit: 512m
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # Reads container logs through the Docker socket (read-only mount, but the socket API itself isn't).
  champsly-alloy:
    image: grafana/alloy:v1.21.2
    mem_limit: 256m
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - champsly-loki

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: champsly
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: champsly-kafka-1:9092,champsly-kafka-2:9092,champsly-kafka-3:9092
    depends_on:
      champsly-kafka-1:
        condition: service_healthy
      champsly-kafka-2:
        condition: service_healthy
      champsly-kafka-3:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
