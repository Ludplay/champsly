
services:
  truco-platform-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - truco-platform-backend


  truco-platform-backend:
    build: ./backend
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgres://user:pass@truco-platform-db:5432/truco
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      - truco-platform-db

  truco-platform-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: truco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules: