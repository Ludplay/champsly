<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="640" fill="#ffffff" />

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Champsly — Target State (AWS) — Horizontal + Scaling + DB Read/Write Split</text>

  <!-- Frontend (CDN) -->
  <rect x="40" y="306" width="220" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="150" y="344" text-anchor="middle" font-size="18" font-weight="600" fill="#0c4a6e">Frontend (CDN)</text>

  <!-- Frontend -> API Gateway (sequential, not concurrent) -->
  <line x1="260" y1="338" x2="340" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- API Gateway -->
  <rect x="340" y="298" width="230" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" />
  <text x="455" y="344" text-anchor="middle" font-size="18" font-weight="600" fill="#713f12">API Gateway</text>

  <!-- API Gateway fan-out into services -->
  <line x1="570" y1="338" x2="610" y2="338" stroke="#475569" stroke-width="2" />
  <line x1="610" y1="338" x2="610" y2="200" stroke="#475569" stroke-width="2" />
  <line x1="610" y1="200" x2="670" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="610" y1="338" x2="610" y2="505" stroke="#475569" stroke-width="2" />
  <line x1="610" y1="505" x2="670" y2="505" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Services zone -->
  <rect x="650" y="90" width="300" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,4" />
  <text x="665" y="112" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">SERVICES</text>

  <!-- Auto Scaling Group -->
  <rect x="670" y="140" width="260" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="4,3" />
  <text x="680" y="155" font-size="11" font-weight="700" fill="#c2410c" letter-spacing="0.5">AUTO SCALING GROUP</text>
  <text x="680" y="168" font-size="10" fill="#7c2d12">EC2 · min 1 / max 2</text>

  <!-- Backend API instance 1 -->
  <rect x="685" y="185" width="110" height="60" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text x="740" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Backend API</text>
  <text x="740" y="227" text-anchor="middle" font-size="10" fill="#7c2d12">instance 1</text>

  <!-- Backend API instance 2 -->
  <rect x="805" y="185" width="110" height="60" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text x="860" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Backend API</text>
  <text x="860" y="227" text-anchor="middle" font-size="10" fill="#7c2d12">instance 2</text>

  <!-- Message Queue (centered between Auto Scaling Group and Lambda) -->
  <rect x="670" y="330" width="260" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
  <text x="800" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">Message</text>
  <text x="800" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">Queue</text>

  <!-- Lambda -->
  <rect x="670" y="470" width="260" height="70" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="2" />
  <text x="800" y="509" text-anchor="middle" font-size="15" font-weight="600" fill="#701a75">Lambda</text>

  <!-- ASG -> Database: write connection -->
  <line x1="930" y1="200" x2="960" y2="200" stroke="#475569" stroke-width="2" />
  <line x1="960" y1="200" x2="960" y2="185" stroke="#475569" stroke-width="2" />
  <line x1="960" y1="185" x2="1040" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="965" y="178" font-size="10" font-weight="600" fill="#334155">write</text>

  <!-- ASG -> Database: read connection (dashed, logical split from Phase 4.6) -->
  <line x1="960" y1="200" x2="960" y2="285" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="960" y1="285" x2="1040" y2="285" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)" />
  <text x="965" y="278" font-size="10" font-weight="600" fill="#047857">read*</text>

  <!-- RDS Primary (write) -->
  <rect x="1040" y="150" width="260" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="1170" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">RDS PostgreSQL</text>
  <text x="1170" y="198" text-anchor="middle" font-size="11" fill="#065f46">primary · write</text>

  <!-- Replication link (future) -->
  <line x1="1170" y1="220" x2="1170" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="1180" y="238" font-size="9" font-style="italic" fill="#64748b">replication*</text>

  <!-- Read Replica (prepared, not provisioned) -->
  <rect x="1040" y="250" width="260" height="70" rx="10" fill="#ecfdf5" fill-opacity="0.45" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" />
  <text x="1170" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">Read Replica</text>
  <text x="1170" y="298" text-anchor="middle" font-size="11" fill="#065f46">prepared · not provisioned</text>

  <!-- Footnote -->
  <text x="650" y="620" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">* Phase 4.6: reads/writes route through separate connections, both hitting the same RDS instance until a real replica is provisioned. Phase 11.8 temporarily provisions a real replica to test the swap only.</text>
</svg>
